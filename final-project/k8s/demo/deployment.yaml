apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "api-server booting with mode=${APP_MODE}"
              mkdir -p /www
              echo "ok" >/www/index.html
              exec httpd -f -p 8080 -h /www
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
