[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-aiops-workflow"
version = "0.1.0"
description = "LangGraph workflow for local-first Kubernetes AIOps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "haystack-ai>=2.0.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "qdrant-haystack>=9.0.0",
  "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
aiops-workflow = "aiops_workflow.cli:main"
aiops-rag-ingest = "aiops_workflow.ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_workflow"]
